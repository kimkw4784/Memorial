<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추억 조각 검수함 | 온새미로 관리자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&family=Pretendard:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body class="admin-body">

    <div class="admin-container">
        <header class="admin-header">
            <div class="header-tag">FAMILY ARCHIVE ADMIN</div>
            <h1 class="admin-title"><span id="adminPetName">코코</span>에게 도착한 추억들</h1>
            <p class="admin-desc">지인분들이 보내주신 소중한 사진과 이야기입니다.<br>선택하여 승인한 사진만 메인 추모관 갤러리에 공개됩니다.</p>
        </header>

        <!-- 상태 필터 탭 -->
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="setFilter('pending')">확인 대기 중 <span id="countPending"
                    class="badge">0</span></button>
            <button class="filter-tab" onclick="setFilter('approved')">전시 승인됨 <span id="countApproved"
                    class="badge">0</span></button>
            <button class="filter-tab" onclick="setFilter('unposted')">제외됨 <span id="countUnposted"
                    class="badge">0</span></button>
        </div>

        <!-- 추억 카드 목록 컨테이너 -->
        <main id="memoryCardList" class="memory-card-list">
            <!-- JS 동적 렌더링 영역 -->
        </main>

        <section class="admin-timeline-section">
            <div class="section-title-box">
                <span class="header-tag">MEMORIAL TIMELINE</span>
                <h2 class="section-sub-title">발자취 타임라인 관리</h2>
                <p class="section-desc">아이와 함께 걸어온 소중한 날들을 시간 순서대로 기록해보세요.</p>
            </div>

            <!-- 발자취 등록 폼 -->
            <form class="timeline-form" onsubmit="handleAddTimeline(event)">
                <div class="timeline-input-row">
                    <input type="date" id="timelineDate" class="timeline-input date-picker-input" required>
                    <input type="text" id="timelineStory" class="timeline-input text-input" placeholder="기억할 순간을 남겨주세요"
                        required>
                    <button type="submit" class="btn-timeline-add">+ 등록</button>
                </div>
            </form>

            <!-- 등록된 타임라인 리스트 -->
            <div class="admin-timeline-list" id="adminTimelineList">
                <!-- JS로 동적 렌더링 -->
            </div>
        </section>

        <div class="admin-footer-links">
            <a href="sample.html" class="link-btn">← 추모관 메인으로 이동</a>
        </div>
    </div>

    <div id="toastMessage" class="toast-popup">상태가 업데이트되었습니다.</div>

    <script src="admin.js"></script>
</body>

</html>
